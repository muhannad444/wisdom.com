<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Wisdom</title>
  <meta name="description" content="Meaningful ideas for a life of curiosity, clarity, and purpose. A small illustrated magazine of 55 quotes, in English and Saudi Arabic.">
  <meta name="theme-color" content="#f5eedf">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233a2e26'/%3E%3Cpath d='M9 22V10h4l3 8 3-8h4v12' fill='none' stroke='%23f5eedf' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <!-- Fonts load from Google Fonts; the CSS falls back to system fonts if offline. Arabic faces are only downloaded when Arabic text is on screen. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <!-- Sets <html lang dir> immediately so the page never flashes in the wrong direction. -->
  <script src="i18n.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>

  <header class="site-header">
    <div class="wrap nav">
      <a class="logo" href="#/" data-i18n-attr="aria-label:home.aria" aria-label="Little Wisdom, home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="6" fill="currentColor"/><circle cx="16" cy="16" r="6.500" fill="none" stroke="#f5eedf" stroke-width="2" stroke-dasharray="34 8" stroke-linecap="round" transform="rotate(-60 16 16)"/></svg>
        <span lang="en">Little Wisdom</span>
      </a>
      <nav class="nav-links" aria-label="Primary" data-i18n-attr="aria-label:nav.primary">
        <a class="nav-link" href="#/library?focus=1" data-nav="library">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg>
          <span><span data-i18n="nav.search">Search</span><span class="label-long" data-i18n="nav.searchMore"> quotes</span></span>
        </a>
        <a class="nav-link" href="#/bookmarks" data-nav="bookmarks">
          <span data-i18n="nav.bookmarks">Bookmarks</span><span class="count-badge" id="bookmark-count" aria-label="0 saved quotes">0</span>
        </a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Language" data-i18n-attr="aria-label:lang.label">
        <button type="button" class="lang-btn" data-lang="en" lang="en" aria-pressed="true">English</button>
        <button type="button" class="lang-btn" data-lang="ar" lang="ar" aria-pressed="false">العربية</button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"><div id="app" class="view"><p class="loading" data-i18n="loading">Opening…</p></div></main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-grid">
        <p class="closing" data-i18n="footer.closing">Make wisdom easy to discover, beautiful to read, and simple to keep.</p>
        <nav aria-label="Footer" data-i18n-attr="aria-label:footer.nav">
          <ul>
            <li><a href="#/" data-i18n="footer.home">Home</a></li>
            <li><a href="#/library" data-i18n="footer.all">All quotes</a></li>
            <li><a href="#/bookmarks" data-i18n="footer.bookmarks">Your bookmarks</a></li>
          </ul>
        </nav>
      </div>
      <small data-i18n="footer.small">Little Wisdom · Illustrations are original drawings made for this site. Bookmarks are stored in this browser only.</small>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="wrap" style="padding:3rem 0">Little Wisdom needs JavaScript to display its quotes. · يحتاج الموقع إلى JavaScript لعرض الاقتباسات.</p></noscript>

  <script src="quotes.js"></script>
  <script src="quotes-ar.js"></script>
  <script src="scenes.js"></script>
  <script src="script.js"></script>
</body>
</html>
